name: Build vLLM Worker (Qwen3.5)

on:
  workflow_dispatch:  # avvia manualmente da GitHub → Actions → Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (model baked into image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vllm-qwen35
          build-args: |
            BASE_IMAGE=runpod/worker-v1-vllm:nightly
            VLLM_VERSION=0.17.0
            MODEL_REPO=Qwen/Qwen3.5-27B-FP8
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          push: true
          tags: |
            ghcr.io/rtu-dataframe/worker-vllm-qwen35:latest
            ghcr.io/rtu-dataframe/worker-vllm-qwen35:nightly-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
