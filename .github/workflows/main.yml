name: Build vLLM Worker (Qwen3.5 — model baked, ghcr.io)

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: rtu-dataframe/worker-vllm-qwen35

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Step 1: build runpod-workers/worker-vllm with VLLM_NIGHTLY=true.
      # This produces the runtime base (PyTorch + runpod handler + vLLM nightly).
      # Pushed as an intermediate `:base-<run_id>` tag on ghcr.io so the next
      # step can pull from it.
      # ----------------------------------------------------------------------
      - name: Build and push base worker-vllm
        uses: docker/build-push-action@v6
        with:
          context: "https://github.com/runpod-workers/worker-vllm.git"
          build-args: VLLM_NIGHTLY=true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:base-${{ github.run_id }}

      # ----------------------------------------------------------------------
      # Step 2: extend the base — pin vLLM 0.17.0, install nvcc, BAKE the
      # Qwen 3.5 27B FP8 weights into the image. HF_TOKEN is mounted as a
      # BuildKit secret so it never appears in image layers/history.
      # ----------------------------------------------------------------------
      - name: Build and push final image (model baked)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vllm-qwen35
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE }}:base-${{ github.run_id }}
            VLLM_VERSION=0.17.0
            MODEL_REPO=Qwen/Qwen3.5-27B-FP8
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:v0.17.0-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
